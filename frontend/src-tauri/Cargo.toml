[package]
name = "english-platform"
version = "0.1.0"
description = "词迹 · 英语学习平台"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "english_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
